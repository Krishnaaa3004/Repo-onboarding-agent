[project]
name = "repo-onboarding-agent"
version = "0.1.0"
description = "An agent that turns a GitHub repo into a personalised onboarding plan."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "google-genai>=1.20",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::SyntaxWarning"]
testpaths = ["tests"]
pythonpath = ["."]
